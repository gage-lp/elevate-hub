<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

     unverified version number can't take the whole app down. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>

<style>
  :root{
    --bg:#030328;
    --panel:#0a0a35;
    --card:#0c0c3c;
    --glass:rgba(255,255,255,0.05);
    --glass-border:rgba(255,255,255,0.14);
    --text:#eef2ff;
    --muted:#8f96c9;
    --accent:#00FBF0;
    --accent-2:#4d7cff;
    --on-accent:#03102b;
    --font-body:"Poppins",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --font-display:"Montserrat",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    font-family:var(--font-body);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);min-height:100dvh;overflow:hidden;position:relative}
  h1,h2,h3{font-family:var(--font-display)}

  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

  /* ---- Nebula ---- */
  .nebula{position:fixed;inset:0;z-index:-2;overflow:hidden;background:
    radial-gradient(120% 100% at 50% -10%, #0a0f47 0%, var(--bg) 60%)}
  .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.28;mix-blend-mode:screen}
  .b1{width:55vw;height:55vw;left:-15vw;top:-20vw;background:radial-gradient(circle,#1a3bff,transparent 70%);animation:drift1 34s ease-in-out infinite}
  .b2{width:45vw;height:45vw;right:-12vw;top:20vh;background:radial-gradient(circle,#00FBF0,transparent 70%);animation:drift2 40s ease-in-out infinite;opacity:.18}
  @keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(7vw,5vh)}}
  @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-5vw,7vh)}}

  .hidden{display:none!important}

  /* ====================== LOGIN ====================== */
  .login-wrap{height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
  .login-card{width:100%;max-width:380px;background:var(--glass);border:1px solid var(--glass-border);
    border-radius:24px;padding:34px 30px;backdrop-filter:blur(18px);box-shadow:0 30px 80px rgba(0,0,0,.55)}
  .login-card .mark{width:46px;height:46px;border-radius:13px;margin:0 auto 18px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 0 30px rgba(0,251,240,.35)}
  .login-card h2{text-align:center;font-size:22px;margin-bottom:4px}
  .login-card p{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px}
  input,textarea{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--glass-border);
    color:var(--text);padding:12px 14px;border-radius:12px;font-size:14px;font-family:inherit;margin-bottom:12px}
  input:focus,textarea:focus{outline:none;border-color:var(--accent)}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
  .err{color:#ff8a8a;font-size:13px;min-height:18px;text-align:center;margin-top:4px}
  .btn{border:1px solid var(--glass-border);background:var(--glass);color:var(--text);font-family:inherit;
    padding:9px 16px;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s;backdrop-filter:blur(8px)}
  .btn:hover{border-color:var(--accent);transform:translateY(-1px)}
  .btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
  .btn.primary{background:var(--accent);border:none;color:var(--on-accent);box-shadow:0 6px 24px rgba(0,251,240,.28)}
  .btn.primary:hover{background:#4ffdf5}
  .btn.danger{border-color:rgba(255,90,90,.5);color:#ff8a8a}
  .btn.danger:hover{background:rgba(255,90,90,.12)}
  .btn.sm{padding:6px 11px;font-size:12px}

  /* ====================== APP SHELL ====================== */
  #app{display:flex;height:100dvh}

  /* sidebar */
  .sidebar{width:118px;flex:0 0 118px;display:flex;flex-direction:column;align-items:center;
    padding:22px 10px;gap:8px;background:linear-gradient(180deg,rgba(10,10,53,.85),rgba(10,10,53,.55));
    border-right:1px solid rgba(255,255,255,.06);backdrop-filter:blur(14px);z-index:10}
  .sidebar .logo{width:38px;height:38px;border-radius:11px;margin-bottom:20px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 0 24px rgba(0,251,240,.3)}
  .nav-item{width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:inherit;
    padding:12px 4px;border-radius:14px;cursor:pointer;color:var(--muted);transition:.2s;border:1px solid transparent;background:none}
  .nav-item:hover{color:var(--text);background:var(--glass);border-color:var(--glass-border)}
  .nav-item.active{color:var(--text);background:var(--glass);border-color:rgba(0,251,240,.4)}
  .nav-item svg{width:22px;height:22px}
  .nav-item span{font-size:11px;font-weight:600;letter-spacing:.2px}
  .nav-spacer{flex:1}
  .nav-user{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted)}
  .avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;color:var(--on-accent);background:linear-gradient(135deg,var(--accent),var(--accent-2))}

  /* content */
  .content{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:24px clamp(20px,4vw,44px) 6px}
  .topbar .title h1{font-size:13px;font-weight:700;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
  .topbar .title h2{font-size:26px;font-weight:700;margin-top:2px}
  .topbar .status{font-size:13px;color:var(--muted);text-align:right}
  .topbar .status .note{display:block;font-size:12px;color:#ffd27b;margin-top:2px}

  .edit-banner{display:none;align-items:center;gap:10px;margin:8px clamp(20px,4vw,44px) 0;
    background:rgba(0,251,240,.1);border:1px solid rgba(0,251,240,.32);
    border-radius:14px;padding:11px 16px;font-size:13px;color:#bff7f4}
  body.editing .edit-banner{display:flex}

  /* rail */
  .rail-wrap{flex:1;position:relative;display:flex;align-items:center;min-height:0}
  .rail{display:flex;gap:22px;overflow-x:auto;overflow-y:hidden;width:100%;height:100%;
    padding:18px clamp(20px,4vw,44px) 26px;scroll-snap-type:x proximity;scroll-behavior:smooth;align-items:center}
  .rail::-webkit-scrollbar{height:8px}
  .rail::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:10px}
  .rail::-webkit-scrollbar-track{background:transparent}

  .card{flex:0 0 auto;width:clamp(240px,24vw,310px);height:min(72vh,500px);
    position:relative;border-radius:20px;overflow:hidden;scroll-snap-align:start;cursor:pointer;
    border:1px solid var(--glass-border);background:var(--card);text-align:left;color:inherit;font-family:inherit;
    transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s,border-color .3s}
  .card:hover{transform:translateY(-8px) scale(1.015);border-color:rgba(0,251,240,.5);
    box-shadow:0 26px 60px rgba(0,0,0,.5),0 0 46px rgba(0,251,240,.16)}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .card .thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .card .thumb.empty{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;
    background:linear-gradient(135deg,rgba(0,251,240,.18),rgba(77,124,255,.28))}
  .card .scrim{position:absolute;inset:0;background:
    linear-gradient(180deg,rgba(3,3,40,.75) 0%,rgba(3,3,40,.18) 32%,rgba(3,3,40,0) 55%,rgba(3,3,40,.6) 100%)}
  .card .label{position:absolute;top:20px;left:22px;right:22px}
  .card .label .sub{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#9ff6f1;margin-bottom:5px}
  .card .label h3{font-size:23px;font-weight:700;line-height:1.15;text-shadow:0 2px 12px rgba(0,0,0,.5)}
  .card .cta{position:absolute;left:22px;right:18px;bottom:18px;z-index:2;
    display:flex;align-items:center;justify-content:space-between;gap:10px}
  .card .cta .lbl{font-size:12.5px;font-weight:600;letter-spacing:.3px;color:rgba(255,255,255,.9);
    text-shadow:0 1px 8px rgba(0,0,0,.6)}
  .card .cta .go{flex:0 0 auto;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow:0 6px 22px rgba(0,251,240,.4);transition:transform .25s}
  .card:hover .cta .go{transform:scale(1.14)}
  .card .cta .go svg{width:20px;height:20px}
  .lock-tag{position:absolute;top:16px;right:16px;font-size:11px;font-weight:600;z-index:2;
    background:rgba(3,3,40,.75);border:1px solid var(--glass-border);padding:4px 9px;border-radius:20px;color:#ffd27b;backdrop-filter:blur(6px)}
  .admin-tools{position:absolute;bottom:18px;left:22px;right:22px;display:none;gap:8px;z-index:3}
  body.editing .admin-tools{display:flex}
  body.editing .card{cursor:grab}
  body.editing .card .cta{display:none}
  .card.dragging{opacity:.45}

  /* rail arrows */
  .rail-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:8;width:44px;height:44px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--glass-border);
    background:rgba(10,10,53,.7);color:var(--text);backdrop-filter:blur(8px);transition:.2s}
  .rail-arrow:hover{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .rail-arrow.left{left:8px}.rail-arrow.right{right:8px}
  .rail-arrow svg{width:20px;height:20px}
  @media(hover:none){.rail-arrow{display:none}}

  .rail-msg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    color:var(--muted);width:100%;text-align:center;padding:24px}
  .rail-msg strong{display:block;color:var(--text);font-size:16px;font-weight:600;margin-bottom:4px;font-family:var(--font-display)}

  /* ====================== EXPANDED DETAIL ====================== */
  .detail-overlay{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
    padding:24px;background:rgba(2,2,20,.8);backdrop-filter:blur(12px)}
  .detail-overlay.show{display:flex}
  .detail{position:relative;width:min(860px,95vw);height:min(520px,86vh);
    border-radius:24px;overflow:hidden;background:var(--panel);border:1px solid var(--glass-border);
    display:flex;box-shadow:0 40px 100px rgba(0,0,0,.6);animation:pop .34s cubic-bezier(.2,.9,.25,1)}
  @keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
  .detail .media{position:relative;flex:0 0 42%;min-width:0;background:#0c0c3c}
  .detail .media #d_hero{position:absolute;inset:0}
  .detail .media img{width:100%;height:100%;object-fit:cover;display:block}
  .detail .media .empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:13px;background:linear-gradient(135deg,rgba(0,251,240,.2),rgba(77,124,255,.3))}
  .detail .media::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(90deg,rgba(10,10,53,0) 72%,rgba(10,10,53,.55) 100%)}
  .detail .info{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;padding:32px clamp(24px,3vw,36px)}
  .detail .info .scroll{flex:1 1 auto;min-height:0;overflow-y:auto}
  .detail .info .sub{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
  .detail .info h2{font-size:28px;font-weight:800;line-height:1.12;margin-bottom:16px}
  .detail .info p{font-size:15px;line-height:1.7;color:#c4cdec;white-space:pre-wrap;max-width:66ch}
  .detail .info .foot{flex:0 0 auto;padding-top:20px}
  .detail .info .open{display:inline-flex;padding:13px 28px;font-size:15px;text-decoration:none}
  .detail .close{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;
    background:rgba(3,3,40,.65);border:1px solid var(--glass-border);color:#fff;cursor:pointer;font-size:17px;
    display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);z-index:3}
  .detail .close:hover{background:rgba(255,90,90,.25)}
  @media(max-width:640px){
    .detail{flex-direction:column;height:min(86vh,640px)}
    .detail .media{flex:0 0 190px}
    .detail .media::after{background:linear-gradient(180deg,rgba(10,10,53,0) 60%,rgba(10,10,53,.6) 100%)}
  }

  /* ====================== ADD/EDIT MODAL ====================== */
  .overlay{position:fixed;inset:0;z-index:70;background:rgba(2,2,20,.74);backdrop-filter:blur(6px);
    display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto}
  .overlay.show{display:flex}
  .modal{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--glass-border);border-radius:22px;padding:28px}
  .modal h2{font-size:20px;margin-bottom:18px}
  .row{display:flex;gap:12px}.row>*{flex:1}
  .toggle{display:flex;align-items:center;gap:10px;margin:6px 0 14px;font-size:14px;cursor:pointer}
  .toggle input{width:auto;margin:0}
  .access-list{max-height:200px;overflow-y:auto;border:1px solid var(--glass-border);border-radius:12px;padding:10px;margin-bottom:6px}
  .access-list label{display:flex;align-items:center;gap:8px;color:var(--text);margin-bottom:8px;cursor:pointer;font-size:14px;font-weight:400}
  .access-list input{width:auto;margin:0}
  .hint{font-size:12px;color:var(--muted);margin-bottom:14px;min-height:16px}
  .hint.warn{color:#ffd27b}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
  .thumb-preview{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;margin-bottom:12px;display:none}

  @media(max-width:720px){
    .sidebar{width:74px;flex-basis:74px}
    .nav-item span,.nav-user span{display:none}
    .card{width:74vw;height:64vh}
  }

  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
      transition-duration:.001ms!important;scroll-behavior:auto!important}
    .card:hover{transform:none}
  }
</style>
</head>
<body>
<div class="nebula" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div></div>

<!-- LOGIN -->
<div id="login" class="login-wrap">
  <div class="login-card">
    <div class="mark" aria-hidden="true"></div>
    <h2>Elevate Hub</h2>
    <p>Sign in with the account set up for you</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" placeholder="you@elevate.com">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="••••••••">
    <button class="btn primary" id="signInBtn" style="width:100%;margin-top:6px" onclick="signIn()">Sign in</button>
    <div id="loginErr" class="err" role="alert"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="logo" aria-hidden="true"></div>
    <button id="navLibrary" class="nav-item active" onclick="showLibrary()" title="Library">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span>Library</span>
    </button>
    <button id="navAdd" class="nav-item hidden" onclick="openModal()" title="Add card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span>Add</span>
    </button>
    <button id="navEdit" class="nav-item hidden" onclick="toggleEdit()" title="Edit mode">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      <span id="navEditLabel">Edit</span>
    </button>
    <div class="nav-spacer"></div>
    <div class="nav-user">
      <div class="avatar" id="avatar" aria-hidden="true"></div>
      <button class="nav-item" onclick="signOut()" title="Sign out" style="padding-top:8px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Sign out</span>
      </button>
    </div>
  </aside>

  <div class="content">
    <div class="topbar">
      <div class="title"><h1>Elevate Hub</h1><h2>Resource Library</h2></div>
      <div class="status" id="who"></div>
    </div>
    <div class="edit-banner">Edit mode — drag cards to reorder, or use the buttons on each card.</div>

    <div class="rail-wrap">
      <button class="rail-arrow left" onclick="scrollRail(-1)" aria-label="Scroll left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg></button>
      <div id="rail" class="rail"></div>
      <button class="rail-arrow right" onclick="scrollRail(1)" aria-label="Scroll right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg></button>
      <div id="railMsg" class="rail-msg hidden"></div>
    </div>
  </div>
</div>

<!-- EXPANDED DETAIL -->
<div id="detailOverlay" class="detail-overlay" role="dialog" aria-modal="true" aria-labelledby="d_title" onclick="if(event.target===this)closeDetail()">
  <div class="detail">
    <div class="media"><div id="d_hero"></div></div>
    <button class="close" id="detailClose" onclick="closeDetail()" aria-label="Close">✕</button>
    <div class="info">
      <div class="scroll">
        <div id="d_sub" class="sub"></div>
        <h2 id="d_title"></h2>
        <p id="d_desc"></p>
      </div>
      <div class="foot"><a id="d_link" class="btn primary open" target="_blank" rel="noopener noreferrer"></a></div>
    </div>
  </div>
</div>

<!-- ADD/EDIT MODAL -->
<div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <h2 id="modalTitle">Add card</h2>
    <input type="hidden" id="cardId">
    <label for="f_title">Title</label><input id="f_title" placeholder="Elevate Academy">
    <label for="f_subtitle">Subtitle</label><input id="f_subtitle" placeholder="Training &amp; Certification">
    <label for="f_description">Description</label><textarea id="f_description" rows="3" placeholder="Shown when the card is expanded"></textarea>
    <div class="row">
      <div><label for="f_link">Link URL</label><input id="f_link" placeholder="https://..."></div>
      <div><label for="f_button">Button label</label><input id="f_button" placeholder="Open"></div>
    </div>
    <label for="f_thumb">Thumbnail (portrait images look best, 5 MB max)</label>
    <img id="thumbPreview" class="thumb-preview" alt="">
    <input id="f_thumb" type="file" accept="image/*">
    <label class="toggle"><input type="checkbox" id="f_visall" onchange="toggleAccessList()"> Visible to all agents</label>
    <div id="accessWrap">
      <label>Or pick who can see it</label>
      <div id="accessList" class="access-list"></div>
      <div id="accessHint" class="hint"></div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn primary" id="saveBtn" onclick="saveCard()">Save</button>
    </div>
    <div id="modalErr" class="err" role="alert"></div>
  </div>
</div>

<script>
let sb, me=null, isAdmin=false, agents=[], sortable=null, cardsById={}, accessById={}, lastFocus=null, signingIn=false;

/* ---- helpers ---- */
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

// Only allow http/https/mailto through to href and src. Blocks javascript: URLs.
function safeUrl(u){
  const s=String(u??'').trim();
  if(!s) return '';
  try{
    const p=new URL(s, location.href);
    return ['http:','https:','mailto:'].includes(p.protocol) ? p.href : '';
  }catch{ return ''; }
}

// Recover the storage object path from a public thumbnail URL so we can clean up.
function thumbPath(url){
  const m=String(url||'').match(/\/storage\/v1\/object\/public\/thumbnails\/(.+)$/);
  return m ? decodeURIComponent(m[1].split('?')[0]) : null;
}

function railMessage(html){
  const msg=document.getElementById('railMsg'), rail=document.getElementById('rail');
  if(html){ msg.innerHTML=html; msg.classList.remove('hidden'); rail.classList.add('hidden'); }
  else{ msg.classList.add('hidden'); msg.innerHTML=''; rail.classList.remove('hidden'); }
}

function showLoginScreen(message){
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');
  document.getElementById('loginErr').textContent=message||'';
  document.body.classList.remove('editing');
}

/* ---- boot ---- */
function init(){
  const err=document.getElementById('loginErr');
  if(!window.supabase){
    err.textContent='Couldn\u2019t load the Supabase library. Check your connection and reload.';
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Catches expired refresh tokens and sign-outs in other tabs, instead of
  // silently showing an empty rail.
  sb.auth.onAuthStateChange((event, session)=>{
    if(!session && me){ me=null; isAdmin=false; showLoginScreen('Your session expired. Sign in again.'); }
  });

  sb.auth.getSession().then(({data})=>{ if(data.session) onLoggedIn(); });
}

async function signIn(){
  if(signingIn) return;
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const err=document.getElementById('loginErr'); err.textContent='';
  const btn=document.getElementById('signInBtn');
  if(!email||!password){ err.textContent='Enter your email and password.'; return; }
  signingIn=true; btn.disabled=true; btn.textContent='Signing in\u2026';
  try{
    const {error}=await sb.auth.signInWithPassword({email,password});
    if(error){ err.textContent=error.message; return; }
    await onLoggedIn();
  }catch(e){
    console.error(e); err.textContent='Couldn\u2019t reach the server. Try again.';
  }finally{
    signingIn=false; btn.disabled=false; btn.textContent='Sign in';
  }
}
async function signOut(){ await sb.auth.signOut(); location.reload(); }

async function onLoggedIn(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user){ showLoginScreen('Sign in to continue.'); return; }

  // maybeSingle() so a missing profile row doesn't throw and leave the user
  // in a half-loaded state with no explanation.
  const {data:profile, error:profErr}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
  if(profErr) console.error(profErr);

  me={...user, ...(profile||{})};
  isAdmin = !!profile && profile.role==='admin';
  const name = profile?.full_name || user.email;

  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('who').innerHTML =
    esc(name) + (isAdmin?' \u00b7 Admin':'') +
    (profile ? '' : '<span class="note">Profile not set up yet \u2014 showing shared resources only.</span>');
  document.getElementById('avatar').textContent = (name||'?').trim().charAt(0).toUpperCase();

  if(isAdmin){
    document.getElementById('navAdd').classList.remove('hidden');
    document.getElementById('navEdit').classList.remove('hidden');
    const {data}=await sb.from('profiles').select('id,full_name').eq('role','agent').order('full_name');
    agents=data||[];
  }
  await loadCards();
}

/* ---- cards ---- */
async function loadCards(){
  const {data:cards,error}=await sb.from('cards').select('*').order('sort_order');
  if(error){
    console.error(error);
    railMessage('<div><strong>Couldn\u2019t load your resources</strong>'+esc(error.message||'')+'</div>'+
                '<button class="btn primary" onclick="loadCards()">Try again</button>');
    return;
  }

  cardsById={}; cards.forEach(c=>cardsById[c.id]=c);

  // Access lists live here, not on the DOM node — a re-render used to wipe
  // them and saving would then delete every card_access row for the card.
  accessById={};
  if(isAdmin){
    const {data:acc,error:accErr}=await sb.from('card_access').select('card_id,user_id');
    if(accErr) console.error(accErr);
    (acc||[]).forEach(a=>{(accessById[a.card_id]=accessById[a.card_id]||[]).push(a.user_id);});
  }

  const rail=document.getElementById('rail');
  rail.innerHTML='';

  if(!cards.length){
    railMessage(isAdmin
      ? '<div><strong>No resources yet</strong>Add your first card to get started.</div><button class="btn primary" onclick="openModal()">Add a card</button>'
      : '<div><strong>No resources yet</strong>Anything shared with you will show up here.</div>');
    return;
  }
  railMessage('');

  cards.forEach(c=>{
    const el=document.createElement('button');
    el.type='button';
    el.className='card'; el.dataset.id=c.id;
    el.setAttribute('aria-label', `${c.title||'Resource'}${c.subtitle?' — '+c.subtitle:''}`);
    const thumb=safeUrl(c.thumbnail_url);
    el.innerHTML=`
      ${isAdmin && !c.visible_to_all ? '<span class="lock-tag">Restricted</span>':''}
      ${thumb ? `<img class="thumb" src="${esc(thumb)}" alt="" loading="lazy" decoding="async">` : `<div class="thumb empty">No image</div>`}
      <div class="scrim"></div>
      <div class="label">
        ${c.subtitle?`<div class="sub">${esc(c.subtitle)}</div>`:''}
        <h3>${esc(c.title)}</h3>
      </div>
      <div class="cta">
        <span class="lbl">Open</span>
        <span class="go"><svg viewBox="0 0 24 24" fill="none" stroke="#03102b" stroke-width="2.4" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg></span>
      </div>
      <div class="admin-tools">
        <button class="btn sm" type="button">Edit</button>
        <button class="btn sm danger" type="button">Delete</button>
      </div>`;
    const [editBtn,delBtn]=el.querySelectorAll('.admin-tools .btn');
    if(editBtn) editBtn.onclick=(e)=>{e.stopPropagation();editCard(c);};
    if(delBtn) delBtn.onclick=(e)=>{e.stopPropagation();deleteCard(c.id);};
    el.addEventListener('click',()=>{ if(!document.body.classList.contains('editing')) openDetail(c.id); });
    rail.appendChild(el);
  });

  if(isAdmin) setupSort();
}

function setupSort(){
  if(!window.Sortable) return;
  if(sortable) sortable.destroy();
  sortable=Sortable.create(document.getElementById('rail'),{
    animation:180, disabled:!document.body.classList.contains('editing'),
    ghostClass:'dragging', onEnd:persistOrder
  });
}

// Only writes the cards whose position actually changed, and reloads if the
// write fails so the screen can't disagree with the database.
async function persistOrder(){
  const ids=[...document.querySelectorAll('#rail .card')].map(el=>el.dataset.id);
  const changed=ids.map((id,i)=>({id,i})).filter(({id,i})=>cardsById[id] && cardsById[id].sort_order!==i);
  if(!changed.length) return;
  const results=await Promise.all(changed.map(({id,i})=>sb.from('cards').update({sort_order:i}).eq('id',id)));
  const failed=results.find(r=>r.error);
  if(failed){
    console.error(failed.error);
    alert('Couldn\u2019t save the new order. Reloading the current order.');
    loadCards();
    return;
  }
  changed.forEach(({id,i})=>{ cardsById[id].sort_order=i; });
}

function toggleEdit(){
  const editing=document.body.classList.toggle('editing');
  document.getElementById('navEdit').classList.toggle('active',editing);
  document.getElementById('navEditLabel').textContent=editing?'Done':'Edit';
  if(sortable) sortable.option('disabled',!editing);
}
function showLibrary(){
  closeDetail(); closeModal();
  document.getElementById('rail').scrollTo({left:0,behavior:'smooth'});
}
function scrollRail(dir){
  const rail=document.getElementById('rail');
  rail.scrollBy({left:dir*(rail.clientWidth*0.7),behavior:'smooth'});
}

/* ---- expanded detail ---- */
function openDetail(id){
  const c=cardsById[id]; if(!c) return;
  lastFocus=document.activeElement;
  const hero=safeUrl(c.thumbnail_url);
  document.getElementById('d_hero').innerHTML = hero
    ? `<img src="${esc(hero)}" alt="" decoding="async">` : `<div class="empty">No image</div>`;
  document.getElementById('d_sub').textContent=c.subtitle||'';
  document.getElementById('d_sub').style.display=c.subtitle?'block':'none';
  document.getElementById('d_title').textContent=c.title;
  document.getElementById('d_desc').textContent=c.description||'';
  document.getElementById('d_desc').style.display=c.description?'block':'none';

  const link=document.getElementById('d_link');
  const href=safeUrl(c.link_url);
  link.textContent=c.button_label||'Open';
  if(href){ link.href=href; link.classList.remove('hidden'); }
  else{ link.removeAttribute('href'); link.classList.add('hidden'); }

  document.getElementById('detailOverlay').classList.add('show');
  document.getElementById('detailClose').focus();
}
function closeDetail(){
  const o=document.getElementById('detailOverlay');
  if(!o.classList.contains('show')) return;
  o.classList.remove('show');
  if(lastFocus && document.contains(lastFocus)) lastFocus.focus();
}

/* ---- add/edit modal ---- */
function resetModalFields(){
  ['cardId','f_title','f_subtitle','f_description','f_link','f_button','f_thumb'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('thumbPreview').style.display='none';
  document.getElementById('thumbPreview').removeAttribute('src');
  document.getElementById('f_visall').checked=false;
  document.getElementById('modalErr').textContent='';
}
function showModal(){
  lastFocus=document.activeElement;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('f_title').focus();
}
function openModal(){
  resetModalFields();
  document.getElementById('modalTitle').textContent='Add card';
  buildAccessList([]); toggleAccessList();
  showModal();
}
function editCard(c){
  resetModalFields();
  document.getElementById('modalTitle').textContent='Edit card';
  document.getElementById('cardId').value=c.id;
  document.getElementById('f_title').value=c.title||'';
  document.getElementById('f_subtitle').value=c.subtitle||'';
  document.getElementById('f_description').value=c.description||'';
  document.getElementById('f_link').value=c.link_url||'';
  document.getElementById('f_button').value=c.button_label||'';
  document.getElementById('f_visall').checked=!!c.visible_to_all;
  const thumb=safeUrl(c.thumbnail_url);
  if(thumb){const p=document.getElementById('thumbPreview');p.src=thumb;p.style.display='block';}
  buildAccessList(accessById[c.id]||[]); toggleAccessList();
  showModal();
}
function buildAccessList(checkedIds){
  const list=document.getElementById('accessList');
  list.innerHTML=agents.length?'':'<span style="color:var(--muted);font-size:13px">No agents yet.</span>';
  agents.forEach(a=>{
    list.insertAdjacentHTML('beforeend',
      `<label><input type="checkbox" value="${esc(a.id)}" onchange="updateAccessHint()" ${checkedIds.includes(a.id)?'checked':''}> ${esc(a.full_name||'(no name)')}</label>`);
  });
  updateAccessHint();
}
function updateAccessHint(){
  const hint=document.getElementById('accessHint');
  if(document.getElementById('f_visall').checked){ hint.textContent=''; hint.classList.remove('warn'); return; }
  const n=document.querySelectorAll('#accessList input:checked').length;
  if(n===0){ hint.textContent='Nobody is selected — this card will be hidden from every agent.'; hint.classList.add('warn'); }
  else{ hint.textContent=n===1?'Visible to 1 agent.':`Visible to ${n} agents.`; hint.classList.remove('warn'); }
}
function toggleAccessList(){
  document.getElementById('accessWrap').style.display=document.getElementById('f_visall').checked?'none':'block';
  updateAccessHint();
}
function closeModal(){
  const o=document.getElementById('overlay');
  if(!o.classList.contains('show')) return;
  o.classList.remove('show');
  if(lastFocus && document.contains(lastFocus)) lastFocus.focus();
}

async function saveCard(){
  const err=document.getElementById('modalErr'); err.textContent='';
  const id=document.getElementById('cardId').value;
  const title=document.getElementById('f_title').value.trim();
  const rawLink=document.getElementById('f_link').value.trim();
  if(!title||!rawLink){ err.textContent='Title and link are required.'; return; }

  const link=safeUrl(rawLink);
  if(!link){ err.textContent='That link isn\u2019t valid. Use a full https:// address.'; return; }

  const file=document.getElementById('f_thumb').files[0];
  if(file){
    if(!file.type.startsWith('image/')){ err.textContent='Thumbnails have to be an image file.'; return; }
    if(file.size>MAX_THUMB_BYTES){
      err.textContent=`That image is ${(file.size/1048576).toFixed(1)} MB. Keep thumbnails under 5 MB.`;
      return;
    }
  }

  const saveBtn=document.getElementById('saveBtn'); saveBtn.disabled=true; saveBtn.textContent='Saving\u2026';
  let uploadedPath=null;
  try{
    let thumbUrl;
    if(file){
      uploadedPath=`${crypto.randomUUID()}-${file.name.replace(/[^\w.\-]/g,'_')}`;
      const {error:upErr}=await sb.storage.from('thumbnails').upload(uploadedPath,file,{contentType:file.type});
      if(upErr) throw upErr;
      thumbUrl=sb.storage.from('thumbnails').getPublicUrl(uploadedPath).data.publicUrl;
    }

    const payload={
      title, subtitle:document.getElementById('f_subtitle').value.trim(),
      description:document.getElementById('f_description').value.trim(),
      link_url:link, button_label:document.getElementById('f_button').value.trim()||'Open',
      visible_to_all:document.getElementById('f_visall').checked
    };
    if(thumbUrl) payload.thumbnail_url=thumbUrl;

    let cardId=id, oldThumb=null;
    if(id){
      oldThumb=cardsById[id]?.thumbnail_url||null;
      const {error}=await sb.from('cards').update(payload).eq('id',id); if(error) throw error;
    }else{
      // max(sort_order)+1, not count(*) — a deleted card used to make the
      // count collide with an existing position.
      const {data:top}=await sb.from('cards').select('sort_order').order('sort_order',{ascending:false}).limit(1).maybeSingle();
      payload.sort_order=(top?.sort_order ?? -1)+1;
      const {data,error}=await sb.from('cards').insert(payload).select('id').single(); if(error) throw error;
      cardId=data.id;
    }

    await sb.from('card_access').delete().eq('card_id',cardId);
    if(!payload.visible_to_all){
      const checked=[...document.querySelectorAll('#accessList input:checked')].map(i=>i.value);
      if(checked.length){
        const {error:accErr}=await sb.from('card_access').insert(checked.map(uid=>({card_id:cardId,user_id:uid})));
        if(accErr) throw accErr;
      }
    }

    // Replaced image? Drop the old file so the bucket doesn't grow forever.
    if(thumbUrl && oldThumb){
      const old=thumbPath(oldThumb);
      if(old) sb.storage.from('thumbnails').remove([old]).catch(e=>console.error(e));
    }

    uploadedPath=null;
    closeModal(); loadCards();
  }catch(e){
    console.error(e);
    // Don't strand the just-uploaded file if the row write failed.
    if(uploadedPath) sb.storage.from('thumbnails').remove([uploadedPath]).catch(()=>{});
    err.textContent=e.message||'Something went wrong.';
  }
  finally{ saveBtn.disabled=false; saveBtn.textContent='Save'; }
}

async function deleteCard(id){
  const c=cardsById[id];
  if(!confirm(`Delete "${c?.title||'this card'}"? This can't be undone.`)) return;
  const {error}=await sb.from('cards').delete().eq('id',id);
  if(error){ console.error(error); alert('Couldn\u2019t delete that card: '+(error.message||'')); return; }
  const path=thumbPath(c?.thumbnail_url);
  if(path) sb.storage.from('thumbnails').remove([path]).catch(e=>console.error(e));
  loadCards();
}

document.getElementById('f_thumb')?.addEventListener('change',e=>{
  const f=e.target.files[0]; const p=document.getElementById('thumbPreview');
  const err=document.getElementById('modalErr');
  if(!f) return;
  if(!f.type.startsWith('image/')){ err.textContent='Thumbnails have to be an image file.'; e.target.value=''; return; }
  if(f.size>MAX_THUMB_BYTES){
    err.textContent=`That image is ${(f.size/1048576).toFixed(1)} MB. Keep thumbnails under 5 MB.`;
    e.target.value=''; return;
  }
  err.textContent='';
  p.src=URL.createObjectURL(f); p.style.display='block';
});

/* ---- keyboard ---- */
function trapFocus(e, container){
  const f=[...container.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),textarea:not([disabled]),select:not([disabled]),[tabindex]:not([tabindex="-1"])')]
    .filter(el=>el.offsetParent!==null);
  if(!f.length) return;
  const first=f[0], last=f[f.length-1];
  if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
}

window.addEventListener('keydown',e=>{
  const modal=document.getElementById('overlay');
  const detail=document.getElementById('detailOverlay');
  const openOverlay = modal.classList.contains('show') ? modal
                    : detail.classList.contains('show') ? detail : null;

  if(e.key==='Escape'){ closeDetail(); closeModal(); return; }
  if(e.key==='Tab' && openOverlay){ trapFocus(e, openOverlay); return; }
  if(e.key==='Enter' && !document.getElementById('login').classList.contains('hidden')) signIn();
});

init();
</script>
</body>
</html>
